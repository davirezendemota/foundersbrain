[package]
name = "dashboard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde_json = "1"
sysinfo    = "0.30"
chrono     = { version = "0.4", features = ["clock"] }
rusqlite   = { version = "0.31", features = ["bundled"] }
walkdir    = "2"
dirs       = "5"
