name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.binary_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            binary_name: sb-macos-arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: sb-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: sb-linux-arm64
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Install cross (Linux arm64)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        run: |
          BINARY="target/${{ matrix.target }}/release/sb"
          if command -v strip &>/dev/null; then
            strip "$BINARY" || true
          fi

      - name: Rename binary
        run: cp target/${{ matrix.target }}/release/sb ${{ matrix.binary_name }}

      - name: Generate checksum
        run: |
          BIN="${{ matrix.binary_name }}"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$BIN" > "${BIN}.sha256"
          else
            shasum -a 256 "$BIN" > "${BIN}.sha256"
          fi
          cat "${BIN}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: |
            ${{ matrix.binary_name }}
            ${{ matrix.binary_name }}.sha256

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package GUI
        run: |
          cd gui
          zip -r ../gui.zip .
          cd ..
          sha256sum gui.zip > gui.zip.sha256
          cat gui.zip.sha256

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          find . -type f | sort | xargs sha256sum | sed 's|^\([^ ]*\)  \./[^/]*/\(.*\)|\1  \2|' > ../SHA256SUMS
          cd ..
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/sb-macos-arm64/sb-macos-arm64
            artifacts/sb-macos-arm64/sb-macos-arm64.sha256
            artifacts/sb-linux-x86_64/sb-linux-x86_64
            artifacts/sb-linux-x86_64/sb-linux-x86_64.sha256
            artifacts/sb-linux-arm64/sb-linux-arm64
            artifacts/sb-linux-arm64/sb-linux-arm64.sha256
            gui.zip
            gui.zip.sha256
            SHA256SUMS
          generate_release_notes: true
