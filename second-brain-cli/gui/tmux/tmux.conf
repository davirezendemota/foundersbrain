# Tmux Configuration with Second Brain Helper Bar
# Source this with: tmux source-file ~/.config/second-brain/tmux/tmux.conf
# Or add to ~/.tmux.conf: source-file ~/.config/second-brain/tmux/tmux.conf

# ── General ───────────────────────────────────────────────────────────────────

set -g default-terminal "screen-256color"
set -g history-limit 10000
set -g base-index 1
set -gw pane-base-index 1
set -g mouse on

# ── Keybindings ──────────────────────────────────────────────────────────────

# Prefix: Ctrl+b (default)
# Reload config: Ctrl+b r
# NOTE: Update the path below to match your actual repo location after setup.
bind r source-file ~/second-brain/guis/second-brain/tmux/tmux.conf \; display "Second Brain tmux config reloaded!"

# Split windows
bind | split-window -h
bind - split-window -v

# Navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Shift+arrow
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5

# ── Colors & Status Bar ───────────────────────────────────────────────────────

set -g status on
set -g status-interval 1
set -g status-position bottom
set -g status-style "bg=#2d5016,fg=#ffffff"

# Left: session name
set -g status-left "#[bg=#4a8024,fg=#ffffff,bold] #{session_name} #[bg=#2d5016,fg=#88cc00] "
set -g status-left-length 50

# Center: window list
set -gw window-status-format "#[fg=#aaaaaa] #I:#W "
set -gw window-status-current-format "#[bg=#88cc00,fg=#000000,bold] #I:#W #[bg=#2d5016,fg=#88cc00]"
set -g status-justify centre

# Right: Claude usage + shortcuts + time (｜ = pipe key, avoids tmux format | parsing)
# NOTE: Update the path below to match your actual repo location after setup.
set -g status-right "#[bg=#2d5016,fg=#magenta]Claude #[fg=#ffffff]#(~/second-brain/guis/second-brain/tmux/get-claude-usage.sh 2>/dev/null || echo '—') #[fg=#88cc00]│ Ctrl+b: #[fg=#ffffff][s switch] [d detach] [w windows] [? help] #[fg=#88cc00]│ #[fg=#ffffff][｜ split right] [- split down] [hjkl panes] #[fg=#88cc00]│ #[fg=#ffffff]%H:%M:%S"
set -g status-right-length 200

# ── Pane borders ──────────────────────────────────────────────────────────────

set -g pane-border-style "fg=#4a8024"
set -g pane-active-border-style "fg=#88cc00"
set -g pane-border-status off

# ── Message style ─────────────────────────────────────────────────────────────

set -g message-style "bg=#4a8024,fg=#ffffff,bold"
set -g message-command-style "bg=#2d5016,fg=#88cc00"

# ── Mode style ────────────────────────────────────────────────────────────────

set -gw mode-style "bg=#88cc00,fg=#000000,bold"
