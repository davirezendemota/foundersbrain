services:
  frontend:
    platform: linux/amd64
    container_name: second_brain_app_frontend_local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL}
    restart: unless-stopped
    ports:
      - "10000:3000"
    environment:
      - NODE_ENV=development
      # URL vista pelo *navegador* (não use http://backend:8000 aqui).
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:10001}
      # URL usada por rotas server-side do Next dentro da rede Docker.
      - BACKEND_INTERNAL_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/.next
    command: sh -c "npm install && npm run dev"

  backend:
    platform: linux/amd64
    container_name: second_brain_app_backend_local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ENVIRONMENT=development
      - BACKEND_API_ROOT_PATH=${BACKEND_API_ROOT_PATH:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-insecure-change-me}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - OPENAI_TTS_VOICE=${OPENAI_TTS_VOICE:-coral}
    ports:
      - "10001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  postgres:
    platform: linux/amd64
    container_name: second_brain_app_postgres_local
    image: postgres:18
    restart: unless-stopped
    ports:
      - "10002:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
